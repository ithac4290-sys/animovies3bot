server {
    listen 80;
    listen 443 ssl;
    server_name s3.animovie.uz a3.animovie.uz stream.animovie.uz animovie.uz;

    ssl_certificate /etc/ssl/certs/animovie.crt;
    ssl_certificate_key /etc/ssl/private/animovie.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 0;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # ⚡️ Tezkor HLS segmentlarini to'g'ridan-to'g'ri Nginx orqali uzatish (0ms kechikish, sendfile)
    location ~* ^/(?:stream|hls)/([^/]+)/([a-zA-Z0-9_\-\.]+\.ts)$ {
        alias /home/ubuntu/animovies3bot/cache/hls/$1/$2;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        types {
            video/mp2t ts;
        }
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        tcp_nodelay on;
        try_files "" @proxy_node;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @proxy_node {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

